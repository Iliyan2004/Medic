<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sehatyab</title>
  <meta name="description" content="Medicines, insurance, financial support, hospital map, community, ambulance and your health record — in one place, built for Pakistan.">
  <meta name="theme-color" content="#0d7a6f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Sehatyab home">
      <img src="/icon.svg" alt="" width="28" height="28"><span>Sehatyab</span>
    </a>
    <div class="topbar-actions">
      <button class="btn-ghost actas" id="actas-pill" type="button" aria-label="Viewing a family member — switch back to me" hidden></button>
      <button class="btn-ghost" id="read-btn" type="button" aria-label="Read this page aloud" title="Read aloud" aria-pressed="false">🔊</button>
      <button class="btn-ghost" id="lang-toggle" type="button" aria-label="Switch language">اردو</button>
      <button class="btn-ghost" id="lowdata-toggle" type="button" aria-pressed="false" title="Low-data mode">⚡</button>
      <a class="btn-ghost" id="notif-link" href="#/notifications" aria-label="Notifications">🔔<span id="notif-count" class="badge-dot" hidden></span></a>
      <a class="btn-ghost" id="account-link" href="#/login">Sign in</a>
    </div>
  </header>
  <div class="layout">
    <nav class="sidenav" id="nav" aria-label="Main"></nav>
    <main id="view" tabindex="-1"><p class="muted pad">Loading…</p></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="pad">Sehatyab needs JavaScript. In an emergency call 1122 or 115.</p></noscript>
</body>
</html>
